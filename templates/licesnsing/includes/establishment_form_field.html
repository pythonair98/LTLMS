{% load widget_tweaks %}
<div class="col-12 col-md-6">
    <div class="establishment-field h-100">
        <label for="{{ field.id_for_label }}" class="form-label">
            {{ field.label }}
            {% if field.field.required %}<span class="text-danger" aria-hidden="true">*</span>{% endif %}
        </label>
        {% if field.errors %}
            {{ field|add_class:"is-invalid" }}
        {% else %}
            {{ field }}
        {% endif %}
        {% if field.help_text %}
            <div class="form-text">{{ field.help_text }}</div>
        {% endif %}
        {% for error in field.errors %}
            <div class="text-danger small mt-1" role="alert">{{ error }}</div>
        {% endfor %}
    </div>
</div>
