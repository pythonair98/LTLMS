version: '3.8'

services:
  # Django Application (Simple logging)
  web:
    build:
      context: .
      dockerfile: Dockerfile.ultra-fast
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=LTLMS.settings_docker_simple
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_NAME=ltlms
      - DATABASE_USER=manager
      - DATABASE_PASSWORD=manger@2025#
    depends_on:
      - db
    command: >
      sh -c "python manage.py migrate --settings=LTLMS.settings_docker_simple &&
             python manage.py collectstatic --noinput --settings=LTLMS.settings_docker_simple &&
             python manage.py runserver 0.0.0.0:8000 --settings=LTLMS.settings_docker_simple"

  # MySQL Database
  db:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=ltlms
      - MYSQL_USER=manager
      - MYSQL_PASSWORD=manger@2025#
      - MYSQL_ROOT_PASSWORD=rootpassword
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data: 