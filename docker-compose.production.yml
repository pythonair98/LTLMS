version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=LTLMS.settings_docker_simple
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_NAME=ltlms
      - DATABASE_USER=manager
      - DATABASE_PASSWORD=manger@2025#
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "sleep 20 &&
             python manage.py makemigrations user_auth ILAS reports --settings=LTLMS.settings_docker_simple &&
             python manage.py migrate user_auth --settings=LTLMS.settings_docker_simple &&
             python manage.py migrate ILAS --settings=LTLMS.settings_docker_simple &&
             python manage.py migrate reports --settings=LTLMS.settings_docker_simple &&
             python manage.py migrate --settings=LTLMS.settings_docker_simple &&
             python manage.py collectstatic --noinput --settings=LTLMS.settings_docker_simple &&
             python init_data.py &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 LTLMS.wsgi:application"
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  nginx:
    image: nginx:alpine
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  db:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=ltlms
      - MYSQL_USER=manager
      - MYSQL_PASSWORD=manger@2025#
      - MYSQL_ROOT_PASSWORD=rootpassword
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "manager", "-pmanger@2025#"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s

volumes:
  mysql_data:
  static_volume:
  media_volume: 