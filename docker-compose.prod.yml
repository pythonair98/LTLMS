version: '3.8'

services:
  # Django Application (Production)
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=LTLMS.settings_docker
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_NAME=ltlms
      - DATABASE_USER=manager
      - DATABASE_PASSWORD=manger@2025#
      - SECRET_KEY=your-secret-key-here-change-in-production
    depends_on:
      - db
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 LTLMS.wsgi:application"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web

  # MySQL Database
  db:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=ltlms
      - MYSQL_USER=manager
      - MYSQL_PASSWORD=manger@2025#
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
  static_volume:
  media_volume: 